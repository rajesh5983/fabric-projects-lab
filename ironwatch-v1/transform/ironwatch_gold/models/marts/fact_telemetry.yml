version: 2

models:
  - name: fact_telemetry
    description: >
      Telemetry fact (DATA_MODEL.md §4). One row per stg_telemetry
      reading (15-min cadence, unaggregated), joined to dim_asset/dim_date
      surrogate keys.
    columns:
      - name: asset_key
        description: FK to dim_asset.asset_key.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: asset_key
      - name: date_key
        description: FK to dim_date.date_key.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: asset_id
        description: Natural key, carried through for convenience/debugging.
        tests:
          - not_null
      - name: telemetry_timestamp
        description: UTC timestamp of the telemetry reading.
        tests:
          - not_null
