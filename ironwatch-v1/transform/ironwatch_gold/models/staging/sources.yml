version: 2

sources:
  - name: bronze
    description: >
      ironwatch_bronze Lakehouse SQL analytics endpoint. Read-only Delta
      tables written by Data Pipeline Copy Activity (ADR-002/ADR-007) —
      dbt never writes to Bronze, only reads from it via Fabric's
      cross-item SQL querying within the same workspace. This is the one
      true source() dbt needs: per ADR-010, Silver is now a Warehouse
      dbt owns the writes to, so the five Silver tables that used to be
      declared here as an external `silver` source are dbt models
      instead — see models/silver/ (build-session task, not yet built).
      A 6th table, fault_events_raw, was added 2026-08-01 to resolve
      OPEN-002 — landed via pl_bronze_fault_events_load, same as the
      other five.
    database: ironwatch_bronze
    schema: dbo
    tables:
      - name: telemetry_raw
      - name: oil_samples_raw
      - name: fault_codes_raw
      - name: asset_master_raw
      - name: service_history_raw
      - name: fault_events_raw
